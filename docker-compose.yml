
services:

  # MySQL Database
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-employee_management_system}
      MYSQL_USER: ${DB_USERNAME:-ems}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - ems

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      DB_URL: "jdbc:mysql://db:3306/${DB_NAME:-employee_management_system}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

      DB_USERNAME: ${DB_USERNAME:-ems}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

    networks:
      ems:
        aliases:
          - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"

    networks:
      - ems

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ems:
    driver: bridge

volumes:
  mysql_data:
