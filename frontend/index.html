<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="description" content="Employee Management System" />
    <title>EMS — People operations</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('ems-theme')
        const preference = ['light', 'dark', 'system'].includes(savedTheme) ? savedTheme : 'system'
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#020617' : '#F8FAFC')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
