spring.application.name=EMS
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@0032}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET:13RP2CUWTOwSwZOmXaGK18NZBDQFmxrBPwdfAIdUplw= }
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# =========================================================
# DEVELOPMENT ACCOUNT BOOTSTRAP
# =========================================================

app.bootstrap.admin.enabled=${EMS_ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.password=${EMS_ADMIN_PASSWORD:}

# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
