# Compose needs Hibernate to create/update the schema because this project
# does not yet have versioned database migrations.

spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/employee_management_system}
spring.datasource.username=${DB_USERNAME:ems}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
